# verify-gate.yml — CI for the documented verification gate (ADR-011).
#
# Supersedes the car-care template: this repo is DB-free by ADR-002 originally,
# now SQLite via Prisma (ADR-011) for ContactInquiry persistence. The gate
# mirrors AGENTS.md:
#   lint → typecheck → test → build → e2e
# preceded by the DB provisioning that the standalone gate requires.
#
# Runs on EVERY push (any ref — no branch filter) and via manual dispatch.
# Guarded by the gate itself — edit the workflow and AGENTS.md together.

name: verify-gate

on:
  push: # every push, any ref — keep this filterless
  workflow_dispatch:

concurrency:
  group: verify-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: documented gate (AGENTS.md)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Ensure ripgrep
        run: command -v rg || (sudo apt-get update -qq && sudo apt-get install -y ripgrep)

      - name: Cache bun installs
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Provisioning: .env BEFORE generate/push — the Prisma client and the
      # DB file must resolve DATABASE_URL via the shared resolver (src/lib/wcc/db-url.ts).
      - name: Provision env + SQLite schema
        run: |
          cp .env.example .env
          bun run db:generate
          bun run db:push

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Install Playwright chromium
        run: bunx playwright install --with-deps chromium

      - name: E2E on the production build
        run: bun run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
